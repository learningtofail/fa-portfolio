name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run typecheck
      # Diffs the vendored Orchis tokens against the pinned design-system commit. CI must reach GitHub.
      - run: npm run tokens:check
        env:
          TOKENS_CHECK_REQUIRE_NETWORK: "1"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The one build of this commit: astro build plus the generated resume PDF. Every later job uses this artifact.
      - run: npm run build
      - run: test -s dist/index.html
      - run: test -s dist/faysal-ahmed-resume.pdf
      # The proposed Caddy CSP lists hashes for Astro's inline code. A stale list is a warning, not a failure:
      # it means docs/caddy/Caddyfile.proposed.md needs the hashes from `npm run csp:hashes`.
      - run: npm run csp:check || echo "::warning::CSP hashes in docs/caddy/Caddyfile.proposed.md are stale; run npm run csp:hashes"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E and accessibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, unit, build, e2e, audit]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Queue deploys instead of cancelling one that is mid-switch. GitHub keeps one running and one pending
    # per group, so a third push replaces the pending one; the newest main always deploys last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Fail fast, before any network step, if the pinned host key secret has not been created.
      - name: Require the pinned SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error title=SSH_KNOWN_HOSTS is empty::Create the SSH_KNOWN_HOSTS repository secret (docs/caddy/Caddyfile.proposed.md, step 2). Deploys never run ssh-keyscan."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify the artifact is not empty
        run: |
          test -s dist/index.html
          test -s dist/faysal-ahmed-resume.pdf

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Atomic release: rsync to releases/<id>/, switch the `current` symlink, keep the last five.
      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: ./scripts/deploy-release.sh
